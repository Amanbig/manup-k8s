{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.vault.enabled) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "manup.fullname" . }}
  labels:
    {{- include "manup.labels" . | nindent 4 }}
type: Opaque
stringData:
  MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  REFRESH_TOKEN_SECRET: {{ .Values.secrets.refreshTokenSecret | quote }}
  DEFAULT_ADMIN_EMAIL: {{ .Values.secrets.defaultAdminEmail | quote }}
  DEFAULT_ADMIN_PASSWORD: {{ .Values.secrets.defaultAdminPassword | quote }}
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.config.smtp.pass }}
  SMTP_PASS: {{ .Values.config.smtp.pass | quote }}
  {{- end }}
{{- end }}
