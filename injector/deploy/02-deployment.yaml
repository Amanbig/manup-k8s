apiVersion: apps/v1
kind: Deployment
metadata:
  name: manup-injector
  namespace: manup-system
  labels:
    app.kubernetes.io/name: manup-injector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: manup-injector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manup-injector
    spec:
      serviceAccountName: manup-injector
      containers:
        - name: injector
          image: procoder588/manup-injector:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-service-name=manup-injector"
            - "-namespace=manup-system"
            - "-port=8443"
            - "-tls-cert-file=/etc/webhook/certs/tls.crt"
            - "-tls-key-file=/etc/webhook/certs/tls.key"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEFAULT_MANUP_URL
              value: "http://manup.manup.svc:7780"
          ports:
            - name: webhook
              containerPort: 8443
          volumeMounts:
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: webhook-certs
          secret:
            secretName: manup-injector-tls
